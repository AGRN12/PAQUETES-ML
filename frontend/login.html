<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="style.css">
<head>
  <script src="config.js"></script>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    .box-1 {
      position: absolute;
      margin-top: 100px;
      left: 350px;
      background: white;
      padding: 80px;
      border-radius: 8px;
      width: 300px;
    }
    input, button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
    }
  </style>
</head>
<body>
  
<script>
  const isElectron = navigator.userAgent.includes('Electron');

  if (isElectron) {

    // ALERT -> TOAST
    window.alert = (msg) => {
      showToast(msg);
    };

    // CONFIRM -> MODAL (PROMESA)
    window.confirm = (msg) => {
      return new Promise(resolve => {
        showConfirm(msg).then(result => resolve(result));
      });
    };

    // PROMPT -> MODAL (PROMESA)
    window.prompt = (msg, placeholder = '') => {
      return new Promise(resolve => {
        showPrompt(msg, placeholder).then(value => resolve(value));
      });
    };

  }
</script>
<div id="toast" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #333;
  color: #fff;
  padding: 10px 15px;
  border-radius: 5px;
  display: none;
  z-index: 9999;
">
</div>
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <p id="modalText"></p>

    <input
      id="modalInput"
      type="password"
      class="modal-input hidden"
      placeholder=""
    />

    <div class="modal-actions">
      <button id="modalCancel">Cancelar</button>
      <button id="modalOk">Aceptar</button>
    </div>
  </div>
</div>
    <div id="navbar"></div>

<div class="box-1">
  <h3>Acceso a contraseñas</h3>

  <input class="input1" id="username" placeholder="Usuario" />
  <input class="input1" id="password" type="password" placeholder="Contraseña" />

  <button onclick="login()">Entrar</button>

  <p id="msg"></p>
</div>
<script>
  fetch('nav.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('navbar').innerHTML = html;

      // Marcar activo según página
      const page = document.body.dataset.page;
      document.querySelectorAll('nav a').forEach(a => {
        if (a.dataset.page === page) {
          a.classList.add('active');
        }
      });
    });
</script>
<script src="login.js"></script>
<!-- MODAL -->
<div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; min-width:300px;">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>

    <input id="modalInput" type="password" style="width:100%; display:none; margin:10px 0;" />

    <div style="text-align:right; margin-top:15px;">
      <button onclick="closeModal(false)">Cancelar</button>
      <button onclick="closeModal(true)">Aceptar</button>
    </div>
  </div>
</div>
<script>
let modalResolve;

function showConfirmModal(message, title = 'Confirmar') {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalInput').style.display = 'none';
    document.getElementById('modalOverlay').style.display = 'flex';
  });
}

function showPromptModal(message, title = 'Ingrese valor') {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;

    const input = document.getElementById('modalInput');
    input.value = '';
    input.style.display = 'block';

    document.getElementById('modalOverlay').style.display = 'flex';
  });
}

function closeModal(ok) {
  const overlay = document.getElementById('modalOverlay');
  const input = document.getElementById('modalInput');

  overlay.style.display = 'none';

  if (!ok) return modalResolve(null);
  modalResolve(input.style.display === 'block' ? input.value : true);
}
</script>
</body>
</html>
