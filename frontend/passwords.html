<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?4">
    <script src="config.js"></script>
    <title>CONTRASEÑAS</title>
</head>


<body data-page="passwords">

<div id="navbar"></div>
<button onclick="btnCerrarSesion()" style="background-color: #d9534f; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px;">
  🚪 Cerrar Sesión
</button>
<div id="adminPanel" style="display:none; border:1px solid #ccc; padding:10px; margin-bottom:15px;">
  <div class="main-content">
  <div class="table-section">
  <h2>👑 Usuarios</h2>

  <table style="width: 100%;">
  <thead>
    <tr>
      <th style="width: 10%;">Usuario</th>
      <th style="width: 10%;">Rol</th>
      <th style="width: 10%;">Acciones</th>
    </tr>
  </thead>
  <tbody id="usersTable"></tbody>
</table>
</div>
</div>

  <h3 class="userc">➕ Crear usuario</h3>
  <input class="newuser" id="newUser" placeholder="Usuario">
  <input class="newPass" id="newPass" type="password" placeholder="Contraseña">

  <select class="selectrol" id="newRole">
    <option value="USER">USER</option>
    <option value="ADMIN">ADMIN</option>
  </select>

  <button class="createuss" onclick="createUser()">Crear usuario</button>
</div>
<div class="box">
  <h2>🔐 Nueva contraseña</h2>

  <input class="inputnew" id="platform" placeholder="Plataforma (Gmail, ML, PC...)" />
  <input class="inputnew" id="username" placeholder="Usuario / correo" />
  <input class="inputnew" id="password" placeholder="Contraseña"  type="password" "/>
  <button onclick="togglePassword()" style="width: 10%;">👁</button>
  <textarea id="notes" placeholder="Notas" style="width: 99%;"></textarea>
  <script>function togglePassword() {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}</script>

  <button onclick="createPassword()">Guardar</button>
</div>

<div class="box">
  <h2>📋 Contraseñas</h2>

  <table>
    <thead>
      <tr>
        <th>Plataforma</th>
        <th>Usuario</th>
        <th>Contraseña</th>
        <th>Notas</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="passwordTable"></tbody>
  </table>
</div>
<button class="exportb" onclick="exportBackup()">📦 Exportar respaldo</button>

<input type="file" id="dbFile" accept=".json">
<button onclick="importBackup()" >📥 Importar respaldo</button>
<div id="importContainer" style="display:none; margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;">
    <p><strong>Procesando base de datos...</strong></p>
    <div style="width: 100%; background: #e0e0e0; border-radius: 10px; height: 25px; overflow: hidden;">
        <div id="progressBar" style="width: 0%; height: 100%; background: #28a745; color: white; text-align: center; line-height: 25px; transition: width 0.3s ease;">
            0%
        </div>
    </div>
    <small style="color: #666;">Esto puede tardar un momento debido al volumen de datos.</small>
</div>
<script>
  fetch('nav.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('navbar').innerHTML = html;

      // Marcar activo según página
      const page = document.body.dataset.page;
      document.querySelectorAll('nav a').forEach(a => {
        if (a.dataset.page === page) {
          a.classList.add('active');
        }
      });
    });
</script>
<script src="passwords.js"></script>
<!-- MODAL -->
<div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center;">
  <div style="background:#fff; padding:20px; border-radius:8px; min-width:300px;">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>

    <input id="modalInput" type="password" style="width:100%; display:none; margin:10px 0;" />

    <div style="text-align:right; margin-top:15px;">
      <button onclick="closeModal(false)">Cancelar</button>
      <button onclick="closeModal(true)">Aceptar</button>
    </div>
  </div>
</div>
<script>
let modalResolve;

function showConfirmModal(message, title = 'Confirmar') {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalInput').style.display = 'none';
    document.getElementById('modalOverlay').style.display = 'flex';
  });
}

function showPromptModal(message, title = 'Ingrese valor') {
  return new Promise(resolve => {
    modalResolve = resolve;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;

    const input = document.getElementById('modalInput');
    input.value = '';
    input.style.display = 'block';

    document.getElementById('modalOverlay').style.display = 'flex';
  });
}

function closeModal(ok) {
  const overlay = document.getElementById('modalOverlay');
  const input = document.getElementById('modalInput');

  overlay.style.display = 'none';

  if (!ok) return modalResolve(null);
  modalResolve(input.style.display === 'block' ? input.value : true);
}
</script>
</body>
</html>
